# Config slam_toolbox (online async) cho Go2 LiDAR trong Gazebo.
# TF: map -> odom (slam) -> trunk (odom publisher) -> lidar_link (URDF fixed).
slam_toolbox:
  ros__parameters:
    use_sim_time: true          # BAT BUOC - Gazebo dung /clock

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Frame + topic (khop robot cua repo nay)
    odom_frame: odom
    map_frame: map
    base_frame: trunk
    scan_topic: /scan
    mode: mapping

    # Ban do
    resolution: 0.05
    max_laser_range: 8.0
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    map_update_interval: 2.0
    transform_publish_period: 0.05
    transform_timeout: 0.3
    tf_buffer_duration: 10.0

    # Scan matching
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_time_between_scans: 0.2
    scan_buffer_size: 10
    link_match_minimum_response_fine: 0.1
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
